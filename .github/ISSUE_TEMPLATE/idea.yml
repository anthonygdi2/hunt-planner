name: Idea
description: Something the planner could do, or do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation in the game, and what the planner doesn’t help with yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: game
    attributes:
      label: Game facts it depends on
      description: Any rewards, odds or rules it needs, with where they come from (TibiaWiki, an in-game screenshot, a video), if you know.
